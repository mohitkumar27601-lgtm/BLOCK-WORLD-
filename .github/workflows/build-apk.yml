      - run: npm install
      - run: node scripts/prepare.js
      - run: npx cap add android
      - run: node scripts/android-setup.js
      - name: App icon (optional)
        continue-on-error: true
        run: |
          pip install pillow
          python3 scripts/make-icons.py
          npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BlockWorld-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BLOCK WORLD (build ${{ github.run_number }})
          body: Download app-debug.apk below, then install it on your phone.
          files: android/app/build/outputs/apk/debug/app-debug.apk
