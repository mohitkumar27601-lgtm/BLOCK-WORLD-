# BLOCK WORLD - ek hi file me poora APK builder (game + scripts + icon andar hi hain).
# GitHub par is file ko  .github/workflows/build-apk.yml  naam se banao. Baaki sab ye khud bana lega.
name: Build BLOCK WORLD APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create project files (game is embedded in this workflow)
        run: |
          mkdir -p src scripts assets
          cat > package.json <<'__EOF__'
          {
            "name": "block-world",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "three": "0.128.0"
            },
            "devDependencies": {
              "@capacitor/assets": "^3.0.5",
              "@capacitor/cli": "^6.1.2"
            }
          }
          __EOF__
          cat > capacitor.config.json <<'__EOF__'
          {
            "appId": "com.blockforge.blockworld",
            "appName": "BLOCK WORLD",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "android": { "backgroundColor": "#000000" }
          }
          __EOF__
          cat > scripts/prepare.js <<'__EOF__'
          // Builds ./www from src/index.html and bundles three.js locally (so the game works offline).
          const fs = require('fs'), path = require('path');
          const root = path.join(__dirname, '..'), www = path.join(root, 'www');
          fs.rmSync(www, { recursive: true, force: true });
          fs.mkdirSync(www, { recursive: true });
          let html = fs.readFileSync(path.join(root, 'src', 'index.html'), 'utf8');
          const three = path.join(root, 'node_modules', 'three', 'build', 'three.min.js');
          if (!fs.existsSync(three)) { console.error('three.min.js not found - run "npm install" first'); process.exit(1); }
          fs.copyFileSync(three, path.join(www, 'three.min.js'));
          const re = /<script src="https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/three\.js\/r128\/three\.min\.js"><\/script>/;
          if (!re.test(html)) { console.error('three.js <script> tag not found in src/index.html'); process.exit(1); }
          html = html.replace(re, '<script src="three.min.js"></script>');
          fs.writeFileSync(path.join(www, 'index.html'), html);
          console.log('www ready (' + Math.round(html.length / 1024) + ' KB game + three.js bundled)');
          __EOF__
          cat > scripts/android-setup.js <<'__EOF__'
          // Run once after "npx cap add android": fullscreen immersive mode, keep screen on, rotation, hardware acceleration.
          const fs = require('fs'), path = require('path');
          const root = path.join(__dirname, '..');
          const cfg = JSON.parse(fs.readFileSync(path.join(root, 'capacitor.config.json'), 'utf8'));
          const orientation = process.env.ORIENTATION || 'fullSensor'; // use sensorLandscape to force landscape
          const man = path.join(root, 'android', 'app', 'src', 'main', 'AndroidManifest.xml');
          let x = fs.readFileSync(man, 'utf8');
          if (!x.includes('android:screenOrientation')) x = x.replace('<activity', '<activity android:screenOrientation="' + orientation + '"');
          if (!x.includes('android:hardwareAccelerated')) x = x.replace('<application', '<application android:hardwareAccelerated="true"');
          fs.writeFileSync(man, x);
          const dir = path.join(root, 'android', 'app', 'src', 'main', 'java', ...cfg.appId.split('.'));
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'MainActivity.java'), `package ${cfg.appId};

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              goImmersive();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) goImmersive();
            }

            private void goImmersive() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          `);
          console.log('Android project patched: orientation=' + orientation + ', immersive fullscreen, keep screen on');
          __EOF__
          cat > scripts/make-icons.py <<'__EOF__'
          from PIL import Image, ImageDraw
          import random
          random.seed(7)
          S=1024
          def tex(base,var,block=32):
              im=Image.new('RGB',(S,S),base);d=ImageDraw.Draw(im)
              for y in range(0,S,block):
                  for x in range(0,S,block):
                      k=random.randint(-var,var);d.rectangle([x,y,x+block-1,y+block-1],fill=tuple(max(0,min(255,v+k)) for v in base))
              return im
          def cube(sc,cx=512,cy=520):
              L=Image.new('RGBA',(S,S),(0,0,0,0));h=int(230*sc);t=int(115*sc);e=int(260*sc)
              top=[(cx,cy-e//2-t),(cx+h,cy-e//2),(cx,cy-e//2+t),(cx-h,cy-e//2)]
              left=[(cx-h,cy-e//2),(cx,cy-e//2+t),(cx,cy+e//2+t),(cx-h,cy+e//2)]
              right=[(cx,cy-e//2+t),(cx+h,cy-e//2),(cx+h,cy+e//2),(cx,cy+e//2+t)]
              for poly,base,var in ((left,(139,94,52),14),(right,(104,70,38),12),(top,(90,176,52),16)):
                  m=Image.new('L',(S,S),0);ImageDraw.Draw(m).polygon(poly,fill=255);L.paste(tex(base,var),(0,0),m)
              d=ImageDraw.Draw(L)
              for poly in (top,left,right):d.line(poly+[poly[0]],fill=(20,30,10,255),width=10,joint='curve')
              return L
          bg=Image.new('RGB',(S,S));bd=ImageDraw.Draw(bg)
          for y in range(S):
              f=y/S;bd.line([(0,y),(S,y)],fill=(int(18+210*f**1.6),int(30+99*f**1.6),int(80-22*f**1.6)))
          for _ in range(60):
              x,y=random.randint(0,S),random.randint(0,S//2);bd.rectangle([x,y,x+4,y+4],fill=(255,255,255))
          bg.save('assets/icon-background.png');cube(.78).save('assets/icon-foreground.png')
          o=bg.convert('RGBA');o.alpha_composite(cube(1.0));o.convert('RGB').save('assets/icon-only.png')
          __EOF__
